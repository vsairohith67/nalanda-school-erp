[package]
name = "nalanda-cross-platform"
version = "0.1.0"
description = "Default-off secure Nalanda Public School ERP app foundation"
authors = ["Nalanda Public School"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nalanda_cross_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
argon2 = "0.5.3"
getrandom = "0.3.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-stronghold = "2.3.1"
url = "2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tempfile = "3.26.0"
