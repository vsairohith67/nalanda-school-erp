name: Portable Staging Foundation exact-head

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact feature commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-staging-${{ inputs.expected_sha }}
  cancel-in-progress: false

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  PORTABLE_CI_EXCEPTION: OWNER_AUTHORIZED
  EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}

jobs:
  server-and-database:
    name: 1 - server and database
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - name: Require exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install inherited PDF and source-scan test tools
        run: |
          sudo apt-get update
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get install -y poppler-utils ripgrep ttf-mscorefonts-installer
          fc-cache -f
          test -f /usr/share/fonts/truetype/msttcorefonts/Georgia_Bold.ttf
          echo 'REPORT_CARD_FONT_DIR=/usr/share/fonts/truetype/msttcorefonts' >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate:postgres && pnpm qa:postgres:parity
      - run: pnpm db:generate:sqlite
      - name: Prepare isolated SQLite database for inherited copied-database tests
        run: |
          mkdir -p tmp/release-ci
          touch tmp/release-ci/synthetic.db
          DATABASE_URL=file:../tmp/release-ci/synthetic.db pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          RELEASE_CI_SYNTHETIC_OPT_IN=true NALANDA_ENVIRONMENT=TEST NODE_ENV=development DATABASE_URL=file:../tmp/release-ci/synthetic.db pnpm exec tsx scripts/prepare-release-ci-synthetic.ts
          cp tmp/release-ci/synthetic.db prisma/dev.db
      - run: pnpm typecheck && pnpm test
      - run: DATABASE_PROVIDER=postgresql DATABASE_URL=postgresql://build.invalid/nalanda DIRECT_URL=postgresql://build.invalid/nalanda pnpm build
      - name: Cleanup
        if: always()
        run: rm -rf tmp/portable-staging data/cloud-backup-rehearsal

  oci-image:
    needs: server-and-database
    name: 2 - OCI image and supply chain
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { architecture: amd64, runner: ubuntu-24.04 }
          - { architecture: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCHITECTURE: ${{ matrix.architecture }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build exact image
        run: docker --context default build --platform "linux/$TARGET_ARCHITECTURE" --pull=false --build-arg SOURCE_COMMIT="$EXPECTED_SHA" --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" -t nalanda-portable-staging:ci .
      - name: Verify configuration and labels
        run: |
          test "$(docker --context default image inspect nalanda-portable-staging:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker --context default image inspect nalanda-portable-staging:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SHA"
          docker --context default image inspect nalanda-portable-staging:ci --format '{{.Id}}' | tee image-digest.txt
          docker --context default image inspect nalanda-portable-staging:ci --format '{{.Size}}' | tee image-size-bytes.txt
          docker --context default save nalanda-portable-staging:ci | sha256sum | tee image-archive-sha256.txt
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { image: "nalanda-portable-staging:ci", format: "spdx-json", output-file: "sbom.spdx.json", upload-artifact: false }
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nalanda-portable-staging:ci
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        if: ${{ !cancelled() }}
        with:
          image: nalanda-portable-staging:ci
          output-format: json
          output-file: grype-results.json
          severity-cutoff: high
          only-fixed: false
          fail-build: true
      - name: Verify native dependencies without application startup or network
        run: |
          test "$(docker --context default image inspect nalanda-portable-staging:ci --format '{{.Architecture}}')" = "$TARGET_ARCHITECTURE"
          test "$(uname -m)" = "$(test "$TARGET_ARCHITECTURE" = arm64 && echo aarch64 || echo x86_64)"
          docker --context default run --rm --name "nalanda-${GITHUB_RUN_ID}-${TARGET_ARCHITECTURE}-native" --label "nalanda.ci.run=${GITHUB_RUN_ID}" --memory 512m --cpus 1 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges:true --network none --read-only --entrypoint /nodejs/bin/node --mount type=bind,source="$PWD/scripts/portable/native-probe.cjs",target=/probe.cjs,readonly nalanda-portable-staging:ci /probe.cjs > native-dependencies.json
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo copy docker-daemon:nalanda-portable-staging:ci oci:oci-layout:release
      - name: Generate exact-head build provenance
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const read = (path) => fs.readFileSync(path, "utf8").trim();
          const sha256 = (path) => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const provenance = {
            schemaVersion: 1,
            architecture: process.env.TARGET_ARCHITECTURE, emulationUsed: false,
            nativeDependenciesSha256: sha256("native-dependencies.json"),
            trivySha256: sha256("trivy-results.json"), grypeSha256: sha256("grype-results.json"),
            dockerfileSha256: sha256("Dockerfile"), lockfileSha256: sha256("pnpm-lock.yaml"),
            sourceRepository: process.env.SOURCE_REPOSITORY,
            sourceCommit: process.env.EXPECTED_SHA,
            sourceDateEpoch: Number(require("node:child_process").execFileSync("git", ["show", "-s", "--format=%ct", "HEAD"], { encoding: "utf8" }).trim()),
            workflowRunUrl: process.env.WORKFLOW_RUN_URL,
            imageName: "nalanda-portable-staging:ci",
            imageId: read("image-digest.txt"),
            imageSizeBytes: Number(read("image-size-bytes.txt")),
            imageArchiveSha256: read("image-archive-sha256.txt").split(/\s+/)[0],
            sbomSpdxJsonSha256: sha256("sbom.spdx.json"),
            signing: { status: "NOT_PERFORMED", reason: "No approved production signing identity or private registry is configured." }
          };
          fs.writeFileSync("build-provenance.json", `${JSON.stringify(provenance, null, 2)}\n`, { flag: "wx" });
          NODE
      - name: Build-context secret/data assertion
        run: |
          test -z "$(docker --context default run --rm --name "nalanda-${GITHUB_RUN_ID}-${TARGET_ARCHITECTURE}-context" --label "nalanda.ci.run=${GITHUB_RUN_ID}" --memory 256m --cpus 1 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges:true --read-only --network none --entrypoint /nodejs/bin/node nalanda-portable-staging:ci -e 'const fs=require(\"fs\"); console.log(fs.existsSync(\"/app/prisma/dev.db\")||fs.existsSync(\"/app/.git\")?\"bad\":\"\")')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portable-oci-evidence-${{ env.EXPECTED_SHA }}-${{ matrix.architecture }}
          path: |
            image-digest.txt
            image-size-bytes.txt
            image-archive-sha256.txt
            sbom.spdx.json
            build-provenance.json
            native-dependencies.json
            trivy-results.json
            grype-results.json
            oci-layout/
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: |
          for suffix in native context; do
            probe="nalanda-${GITHUB_RUN_ID}-${TARGET_ARCHITECTURE}-${suffix}"
            if test -n "$(docker --context default container ls --all -q --filter "name=^/${probe}$")"; then docker --context default container rm -f "$probe"; fi
            test -z "$(docker --context default container ls --all -q --filter "name=^/${probe}$")"
          done
          if test -n "$(docker --context default image ls -q nalanda-portable-staging:ci)"; then docker --context default image rm nalanda-portable-staging:ci; fi
          test -z "$(docker --context default image ls -q nalanda-portable-staging:ci)"

  oci-release-index:
    needs: oci-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-oci-evidence-${{ env.EXPECTED_SHA }}-amd64
          path: oci-input/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-oci-evidence-${{ env.EXPECTED_SHA }}-arm64
          path: oci-input/arm64
      - run: node scripts/portable/oci-index.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-multiplatform-oci-${{ env.EXPECTED_SHA }}
          path: oci-release/
          if-no-files-found: error
          retention-days: 14

  portable-stack:
    needs: oci-release-index
    name: 3 - portable stack
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Persist disposable target coordinates
        run: |
          echo "COMPOSE_PROJECT_NAME=nalanda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-stack" >> "$GITHUB_ENV"
          echo "PORTABLE_CI_ROOT=$GITHUB_WORKSPACE/tmp/portable-staging/nalanda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-stack" >> "$GITHUB_ENV"
          echo "PORTABLE_SYNTHETIC_SECRET_ROOT=$GITHUB_WORKSPACE/tmp/portable-staging/nalanda-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-stack/secrets" >> "$GITHUB_ENV"
      - name: Full synthetic stack
        shell: pwsh
        run: ./scripts/portable/qa-stack.ps1
      - name: Independent disposable teardown and readback
        if: always()
        run: pnpm exec tsx scripts/portable/ci-safety.ts cleanup
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-stack-cleanup-${{ env.EXPECTED_SHA }}
          path: .qa-artifacts/portable-ci/*.json
          if-no-files-found: error
          retention-days: 14

  distributed-runtime:
    needs: portable-stack
    name: 4 - distributed runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:portable-runtime
      - name: Prepare isolated synthetic SQLite database for copied-database regressions
        run: |
          mkdir -p tmp/portable-ci
          touch tmp/portable-ci/synthetic.db
          DATABASE_URL=file:../tmp/portable-ci/synthetic.db pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          cp tmp/portable-ci/synthetic.db prisma/dev.db
      - run: pnpm security:resilience:acceptance && pnpm qa:offline-sync && pnpm qa:cross-platform-apps
      - if: always()
        run: rm -rf tmp/portable-staging

  object-storage-and-recovery:
    needs: distributed-runtime
    name: 5 - object storage and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", persist-credentials: false }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated synthetic SQLite database
        run: |
          mkdir -p tmp/portable-ci
          touch tmp/portable-ci/synthetic.db
          DATABASE_URL=file:../tmp/portable-ci/synthetic.db pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          cp tmp/portable-ci/synthetic.db prisma/dev.db
      - run: DATABASE_URL=file:../tmp/portable-ci/synthetic.db pnpm qa:portable-runtime && DATABASE_URL=file:../tmp/portable-ci/synthetic.db pnpm backup
      - run: pnpm audit --ignore-registry-errors --audit-level high
      - if: always()
        run: rm -rf backups tmp data/cloud-backup-rehearsal

  full-synthetic-acceptance:
    needs: object-storage-and-recovery
    name: 6 - full synthetic acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.EXPECTED_SHA }}", fetch-depth: 0, persist-credentials: false }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install inherited PDF and source-scan test tools
        run: |
          sudo apt-get update
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get install -y poppler-utils ripgrep ttf-mscorefonts-installer
          fc-cache -f
          test -f /usr/share/fonts/truetype/msttcorefonts/Georgia_Bold.ttf
          echo 'REPORT_CARD_FONT_DIR=/usr/share/fonts/truetype/msttcorefonts' >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated realistic synthetic SQLite database
        run: |
          mkdir -p tmp/release-ci
          touch tmp/release-ci/synthetic.db
          DATABASE_URL=file:../tmp/release-ci/synthetic.db pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          RELEASE_CI_SYNTHETIC_OPT_IN=true NALANDA_ENVIRONMENT=TEST NODE_ENV=development DATABASE_URL=file:../tmp/release-ci/synthetic.db pnpm exec tsx scripts/prepare-release-ci-synthetic.ts
          cp tmp/release-ci/synthetic.db prisma/dev.db
      - name: Sequential full-scope acceptance
        env:
          DATABASE_URL: file:../tmp/release-ci/synthetic.db
          NALANDA_ENVIRONMENT: TEST
        run: |
          pnpm routes:list
          pnpm lifecycle:backfill
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm backup
          pnpm git:safety-check
      - name: Inherited focused product regressions
        run: |
          pnpm qa:final-scope:focused
      - name: Cleanup
        if: always()
        run: rm -rf tmp backups data
