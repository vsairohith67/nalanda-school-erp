name: Student items and prior-year concessions exact-head
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-financial-contract:
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: synthetic
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      NALANDA_ENVIRONMENT: TEST
      DATABASE_PROVIDER: ${{ matrix.provider }}
      POSTGRES_READINESS_SYNTHETIC_QA: "1"
      DATABASE_URL: file:../tmp/exact-head.db
      POSTGRES_CI_USER: synthetic
      POSTGRES_CI_PASSWORD: synthetic-ci-only
      POSTGRES_CI_DATABASE: synthetic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 11.21.0 }
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated synthetic PostgreSQL connection
        if: matrix.provider == 'postgresql'
        shell: bash
        run: |
          {
            printf 'DATABASE_URL=postgresql://%s' "$POSTGRES_CI_USER"
            printf ':%s' "$POSTGRES_CI_PASSWORD"
            printf '@127.0.0.1:5432/%s?schema=public\n' "$POSTGRES_CI_DATABASE"
            printf 'DIRECT_URL=postgresql://%s' "$POSTGRES_CI_USER"
            printf ':%s' "$POSTGRES_CI_PASSWORD"
            printf '@127.0.0.1:5432/%s?schema=public\n' "$POSTGRES_CI_DATABASE"
          } >> "$GITHUB_ENV"
      - name: Verify exact source and paired schema
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node scripts/postgres/schema-contract.mjs --check
          node scripts/postgres/trigger-parity.mjs --check
          pnpm db:generate
      - name: Install genuine document font and PostgreSQL client
        id: document_fonts
        env:
          FONT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y cabextract fontconfig curl postgresql-client
          sudo -n python3 tests/document-font-bootstrap.test.py
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,RUNNER_TEMP,GITHUB_ENV,FONT_EXPECTED_SHA python3 scripts/bootstrap-document-fonts.py prepare
      - run: pnpm exec tsx scripts/qa-shared-document-fonts.ts
      - name: Synthetic financial transactions and nonempty source-contract restores
        run: pnpm exec vitest run tests/student-items-prior-year-concessions.test.ts tests/prior-year-concession-api.test.ts tests/recovery-backup-compatibility.test.ts
      - name: Retain reviewed restore-matrix metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-1c-restore-matrix-${{ matrix.provider }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/recovery-1c/restore-matrix-${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact-head coordinates
        if: always()
        run: git show -s --format='commit=%H tree=%T'
      - name: Verify owned document-font cleanup
        if: always() && steps.document_fonts.outcome != 'skipped'
        env:
          FONT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,RUNNER_TEMP,GITHUB_ENV,FONT_EXPECTED_SHA python3 scripts/bootstrap-document-fonts.py cleanup
