name: Master Requirements Reconciliation 1A exact-head

on:
  pull_request:
    paths:
      - ".github/workflows/master-requirements-reconciliation.yml"
      - "config/master-requirements*"
      - "config/product-experience-debt-register.json"
      - "lib/master-requirements.ts"
      - "scripts/master-requirements-validate.ts"
      - "tests/master-requirements*.test.ts"
      - "docs/requirements/**"
      - "docs/architecture/**"
      - "docs/evidence/MASTER_REQUIREMENTS*"
      - "docs/prompts/PORTABLE_DEPLOYMENT_OBSERVABILITY_FOUNDATION_1B.md"
      - "docs/tracker-patches/MASTER_REQUIREMENTS*"
      - "app/api/communication/**"
      - "app/communication/**"
      - "components/communication-*"
      - "config/release-feature-flags.json"
      - "lib/communication-*"
      - "lib/backup.ts"
      - "lib/restore*.ts"
      - "lib/release-feature-flag-runtime.ts"
      - "lib/request-security.ts"
      - "lib/whatsapp-*"
      - "lib/sms-email-*"
      - "middleware.ts"
      - "prisma/**"
      - "scripts/*communication*"
      - "tests/communication-delivery-foundation-1a.test.ts"
      - "docs/COMMUNICATION_*"
      - "docs/IN_APP_NOTIFICATION_CENTRE.md"
      - "docs/evidence/COMMUNICATION_*"
      - "docs/prompts/COMMUNICATION_*"
      - "docs/prompts/NATIVE_PUSH_*"
      - "docs/prompts/REAL_USER_ACCESS_ACTIVATION_1B*"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact feature commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: master-requirements-${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
  NALANDA_ENVIRONMENT: "TEST"
  LIVE_PROVIDERS_ENABLED: "false"
  RELEASE_FEATURE_FLAGS_QA_MODE: "SYNTHETIC_COPY_ONLY"

jobs:
  exact-head-windows-full-regression:
    name: Exact-head requirements, security, shared-platform and full ERP regression
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:../tmp/release-ci/synthetic.db
      BACKUP_DIRECTORY: tmp/release-ci/backups
      APP_ORIGIN: http://127.0.0.1:3000
      COMMUNICATION_DESTINATION_HASH_PEPPER: synthetic-communication-ci-pepper-2026-09-04
      COMMUNICATION_SYNTHETIC_WEBHOOK_SECRET: synthetic-communication-ci-webhook-secret-2026-09-04
      COMMUNICATION_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact source head
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw "Exact-head checkout mismatch" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install exact lockfile and pinned regression tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install ripgrep --version=15.2.0 -y --no-progress
          rg --version
          $popplerArchive = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0.zip'
          $popplerExtract = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0'
          Invoke-WebRequest -Uri 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.02.0-0/Release-26.02.0-0.zip' -OutFile $popplerArchive
          $expectedPopplerSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $actualPopplerSha256 = (Get-FileHash -LiteralPath $popplerArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPopplerSha256 -ne $expectedPopplerSha256) { throw "Pinned Poppler archive checksum mismatch" }
          Expand-Archive -LiteralPath $popplerArchive -DestinationPath $popplerExtract
          $pdfToPpm = Get-Item -LiteralPath (Join-Path $popplerExtract 'poppler-26.02.0\Library\bin\pdftoppm.exe') -ErrorAction Stop
          "REPORT_CARD_PDFTOPPM_PATH=$($pdfToPpm.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          & $pdfToPpm.FullName -v
          $qpdfArchive = Join-Path $env:RUNNER_TEMP 'qpdf-12.4.1-msvc64.zip'
          $qpdfExtract = Join-Path $env:RUNNER_TEMP 'qpdf-12.4.1'
          Invoke-WebRequest -Uri 'https://github.com/qpdf/qpdf/releases/download/v12.4.1/qpdf-12.4.1-msvc64.zip' -OutFile $qpdfArchive
          if ((Get-FileHash -LiteralPath $qpdfArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3cd016cd433ef7232e42f4c13348a49cc14907a3c7278ef4f99120593126f7a6') { throw 'Pinned qpdf archive checksum mismatch' }
          Expand-Archive -LiteralPath $qpdfArchive -DestinationPath $qpdfExtract
          $qpdf = @(Get-ChildItem -LiteralPath $qpdfExtract -Filter qpdf.exe -Recurse)
          if ($qpdf.Count -ne 1) { throw 'Expected exactly one pinned qpdf executable' }
          "QPDF_EXECUTABLE_PATH=$($qpdf[0].FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "QPDF_EXECUTABLE_SHA256=$((Get-FileHash -LiteralPath $qpdf[0].FullName -Algorithm SHA256).Hash)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          pnpm install --frozen-lockfile
      - name: Focused reconciliation and schema validation
        run: pnpm exec vitest run tests/master-requirements && pnpm exec tsx scripts/master-requirements-validate.ts
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - run: pnpm exec prisma validate --schema prisma/schema.prisma
      - name: Focused, copied-database, independent, dependency and public-repository gates
        shell: pwsh
        env:
          COMMUNICATION_CREATE_CI_BASELINE: "1"
          RELEASE_CI_SYNTHETIC_OPT_IN: "true"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm qa:communication-delivery
          pnpm qa:communication-delivery:independent
          pnpm qa:communication-delivery:public-repo-scan
          pnpm qa:real-user-access-readiness:public-repo-scan
          pnpm audit --audit-level high
      - name: Prepare isolated full-regression database
        shell: pwsh
        env:
          NODE_ENV: development
          RELEASE_CI_SYNTHETIC_OPT_IN: "true"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path tmp\release-ci | Out-Null
          if (Test-Path -LiteralPath tmp\release-ci\synthetic.db) { throw "Synthetic database already exists" }
          New-Item -ItemType File -Path tmp\release-ci\synthetic.db | Out-Null
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm exec tsx scripts/prepare-release-ci-synthetic.ts
          Copy-Item -LiteralPath tmp\release-ci\synthetic.db -Destination prisma\dev.db
      - name: Routes, lifecycle, SQLite migration and backup restore
        run: pnpm routes:list && pnpm lifecycle:backfill && pnpm migration:fresh-check && pnpm migration:existing-db-check && pnpm migration:restore-check && pnpm backup && pnpm git:safety-check
      - name: Affected identity, security, pilot, onboarding and Product Experience foundations
        run: pnpm security:resilience:acceptance && pnpm qa:synthetic-pilot && pnpm qa:onboarding-preparation && pnpm qa:product-experience
      - name: Shared Windows, Android, iOS and browser-platform contracts
        run: pnpm test:cross-platform && pnpm app:typecheck && pnpm app:build:web && pnpm app:rust:test
      - name: Corrected-scope regression, full tests, typecheck and production build
        run: pnpm exec vitest run tests/final-corrected-scope-acceptance.test.ts && pnpm test && pnpm typecheck && pnpm build
      - name: Remove synthetic databases, backups and sink material
        if: always()
        shell: pwsh
        run: |
          $targets = @((Join-Path (Get-Location) 'tmp\release-ci'), (Join-Path (Get-Location) 'prisma\dev.db'))
          foreach ($target in $targets) {
            $resolvedParent = [IO.Path]::GetFullPath((Split-Path -Parent $target))
            if (-not $resolvedParent.StartsWith([IO.Path]::GetFullPath((Get-Location).Path), [StringComparison]::OrdinalIgnoreCase)) { throw "Cleanup target escaped workspace" }
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          }

  exact-head-postgresql-17:
    name: Exact-head PostgreSQL 17 migration, repeat deploy, constraints and parity
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: nalanda_migrator
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-communication
          POSTGRES_DB: nalanda_communication_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nalanda_migrator -d nalanda_communication_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_PROVIDER: postgresql
      POSTGRES_READINESS_SYNTHETIC_QA: "1"
      POSTGRES_USER: nalanda_migrator
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-communication
      POSTGRES_DB: nalanda_communication_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact source head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Configure disposable loopback PostgreSQL
        shell: bash
        run: |
          database_url=$(printf '%s://%s:%s@127.0.0.1:5432/%s?schema=public&application_name=communication-synthetic-ci' postgresql "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB")
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$database_url" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate:postgres
      - name: Deploy baseline plus communication migration twice
        run: pnpm db:migrate:postgres && pnpm db:migrate:postgres && pnpm db:status:postgres
      - name: Verify model/table/index/constraint/trigger parity and PostgreSQL behavior
        run: pnpm qa:postgres:parity && pnpm qa:postgres
