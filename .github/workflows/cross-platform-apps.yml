name: Cross-platform apps 1A

on:
  pull_request:
    paths:
      - "apps/nalanda-cross-platform/**"
      - "app/api/native-auth/**"
      - "app/api/native/**"
      - "app/native/**"
      - "lib/native-app/**"
      - "lib/offline-sync/**"
      - "prisma/**"
      - "tests/*cross-platform*"
      - "tests/native-auth-1a.test.ts"
      - "middleware.ts"
      - "lib/request-security.ts"
      - "lib/security-resilience.ts"
      - "lib/trusted-client.ts"
      - "scripts/harden-cross-platform-generated-project.mjs"
      - "config/release-feature-flags.json"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cross-platform-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NALANDA_NATIVE_PROFILE: "NO_REMOTE_SERVER_CONFIGURED"

jobs:
  contracts:
    name: TypeScript, contracts and bundled shell
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DATABASE_URL: "file:../tmp/release-ci/synthetic.db"
      NALANDA_ENVIRONMENT: "TEST"
      NALANDA_RELEASE_ID: cross-platform-ci-${{ github.run_id }}
      NALANDA_RELEASE_CHANNEL: "TEST"
      NEXT_PUBLIC_PWA_BUILD_VERSION: cross-platform-ci-${{ github.run_id }}
      NALANDA_MINIMUM_WEB_CLIENT: cross-platform-ci-${{ github.run_id }}
      NALANDA_CLIENT_UPDATE_SEVERITY: "AVAILABLE"
      NALANDA_RELEASE_DATE: "2026-08-26T00:00:00.000Z"
      NALANDA_STANDALONE_BUILD: "true"
      APP_ORIGIN: "http://127.0.0.1:3000"
      PRIVATE_STORAGE_ROOT: ${{ github.workspace }}/tmp/release-ci/private
      BACKUP_DIRECTORY: ${{ github.workspace }}/tmp/release-ci/backups
      LIVE_PROVIDERS_ENABLED: "false"
      PUBLIC_WEBSITE_INDEXING_ENABLED: "false"
      NALANDA_STAGING_BANNER: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install pinned full-regression tools
        shell: pwsh
        run: |
          choco install ripgrep --version=15.2.0 -y --no-progress
          rg --version
          $popplerArchive = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0.zip'
          $popplerExtract = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0'
          Invoke-WebRequest -Uri 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.02.0-0/Release-26.02.0-0.zip' -OutFile $popplerArchive
          $expectedPopplerSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $actualPopplerSha256 = (Get-FileHash -LiteralPath $popplerArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPopplerSha256 -ne $expectedPopplerSha256) { throw "Pinned Poppler archive checksum mismatch" }
          Expand-Archive -LiteralPath $popplerArchive -DestinationPath $popplerExtract
          $pdfToPpm = Get-Item -LiteralPath (Join-Path $popplerExtract 'poppler-26.02.0\Library\bin\pdftoppm.exe') -ErrorAction Stop
          "REPORT_CARD_PDFTOPPM_PATH=$($pdfToPpm.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          & $pdfToPpm.FullName -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - run: pnpm exec prisma validate --schema prisma/schema.prisma
      - name: Prepare isolated synthetic database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp\release-ci | Out-Null
          if (Test-Path -LiteralPath tmp\release-ci\synthetic.db) { throw "Cross-platform CI synthetic database already exists" }
          New-Item -ItemType File -Path tmp\release-ci\synthetic.db | Out-Null
          pnpm exec prisma migrate deploy
          $env:NODE_ENV = 'development'
          $env:RELEASE_CI_SYNTHETIC_OPT_IN = 'true'
          pnpm exec tsx scripts/prepare-release-ci-synthetic.ts
          Copy-Item -LiteralPath tmp\release-ci\synthetic.db -Destination prisma\dev.db
      - run: pnpm git:safety-check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm security:resilience:acceptance
      - name: Route and lifecycle inventory
        run: |
          pnpm routes:list
          pnpm lifecycle:backfill
      - run: pnpm test
      - name: Migration and restore-twice acceptance
        run: |
          pnpm migration:inventory
          pnpm migration:fresh-check
          pnpm migration:existing-db-check
          pnpm migration:schema-check
          pnpm migration:restore-check
      - run: pnpm backup
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm app:typecheck
      - run: pnpm test:cross-platform
      - run: pnpm app:build:web

  windows:
    name: Unsigned Windows NSIS compiler gate
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Record Windows compiler environment
        shell: pwsh
        run: node --version; pnpm --version; rustc --version; cargo --version; Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture
      - run: pnpm app:rust:test
      - run: pnpm app:windows:build
      - name: Write Windows package checksum
        shell: pwsh
        run: Get-ChildItem apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$([IO.Path]::GetFileName($_.Path))" } | Set-Content apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Verify Windows package checksum
        shell: pwsh
        working-directory: apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis
        run: Get-Content SHA256SUMS.txt | ForEach-Object { $parts = $_ -split ' \*', 2; if ((Get-FileHash -Algorithm SHA256 -LiteralPath $parts[1]).Hash -ne $parts[0]) { throw "Windows package checksum mismatch" } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-nsis
          path: |
            apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/*.exe
            apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug build and emulator UX gate
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Record Android compiler environment
        run: node --version && pnpm --version && rustc --version && cargo --version && java -version && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: pnpm app:android:init
      - run: pnpm app:android:build
      - name: Exercise the packaged app in an Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/px1a-avd"
          mkdir -p tmp/platform-review "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          test -x "$ADB"
          echo no | "$AVDMANAGER" create avd --force --name px1a_phone --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          test -f "$ANDROID_AVD_HOME/px1a_phone.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx px1a_phone
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          EMULATOR_LOG="$RUNNER_TEMP/px1a-emulator.log"
          nohup "$ANDROID_HOME/emulator/emulator" -avd px1a_phone -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$EMULATOR_LOG" 2>&1 &
          if ! timeout 240 "$ADB" wait-for-device; then
            cat "$EMULATOR_LOG"
            exit 1
          fi
          adb_cmd() { timeout 60 "$ADB" "$@"; }
          for attempt in $(seq 1 90); do
            if [ "$(adb_cmd shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if [ "$attempt" = "90" ]; then cat "$EMULATOR_LOG"; exit 1; fi
            sleep 2
          done
          APK_PATH="$(find apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          adb_cmd install -r "$APK_PATH"
          PACKAGE="com.nalandaps.erp"
          adb_cmd shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 4
          adb_cmd shell dumpsys activity activities > tmp/platform-review/android-activity-state.txt
          grep -m1 -F 'mResumedActivity' tmp/platform-review/android-activity-state.txt | grep -F "$PACKAGE"
          adb_cmd shell uiautomator dump /sdcard/px1a-window.xml
          adb_cmd pull /sdcard/px1a-window.xml tmp/platform-review/android-window.xml
          adb_cmd exec-out screencap -p > tmp/platform-review/android-synthetic-phone-portrait.png
          cat tmp/platform-review/android-window.xml
          if ! grep -Eq 'Nalanda|Welcome back|App PIN' tmp/platform-review/android-window.xml; then
            grep -F 'android.webkit.WebView' tmp/platform-review/android-window.xml
          fi
          adb_cmd shell input tap 540 900
          sleep 1
          adb_cmd exec-out screencap -p > tmp/platform-review/android-synthetic-soft-keyboard.png
          adb_cmd shell settings put system accelerometer_rotation 0
          adb_cmd shell settings put system user_rotation 1
          sleep 2
          adb_cmd exec-out screencap -p > tmp/platform-review/android-synthetic-landscape.png
          adb_cmd shell input keyevent KEYCODE_HOME
          adb_cmd shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          adb_cmd shell input keyevent KEYCODE_BACK
          adb_cmd shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          adb_cmd shell am force-stop "$PACKAGE"
          adb_cmd shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          adb_cmd shell am start -W -a android.intent.action.VIEW -d 'nalandaps-erp://auth/callback?code=invalid&state=invalid&request_id=invalid'
          adb_cmd shell wm size 1280x800
          adb_cmd shell wm density 160
          adb_cmd shell settings put system user_rotation 0
          sleep 2
          adb_cmd exec-out screencap -p > tmp/platform-review/android-synthetic-tablet.png
          adb_cmd shell svc wifi disable
          adb_cmd shell svc data disable || true
          adb_cmd shell am force-stop "$PACKAGE"
          adb_cmd shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 2
          adb_cmd exec-out screencap -p > tmp/platform-review/android-synthetic-offline.png
          adb_cmd shell svc wifi enable
          adb_cmd shell svc data enable || true
          adb_cmd shell wm size reset
          adb_cmd shell wm density reset
          adb_cmd logcat -d -t 800 AndroidRuntime:E '*:S' > tmp/platform-review/android-runtime-errors.txt || true
          if grep -F "$PACKAGE" tmp/platform-review/android-runtime-errors.txt; then cat tmp/platform-review/android-runtime-errors.txt; exit 1; fi
          printf '%s\n' 'SYNTHETIC UX EVIDENCE ONLY - NO REAL RECORDS' > tmp/platform-review/ANDROID-SYNTHETIC.txt
      - name: Write Android package checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk
        run: find . -type f -name '*.apk' -exec sha256sum {} \; > SHA256SUMS.txt
      - name: Verify Android package checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-android-debug-apk
          path: |
            apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-android-emulator-ux
          path: tmp/platform-review/android-*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build and shared UI gate
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Record iOS compiler environment
        run: node --version && pnpm --version && rustc --version && cargo --version && xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - run: pnpm app:ios:init
      - run: pnpm app:rust:test
      - run: pnpm app:ios:build
      - name: Exercise the packaged app in iPhone and iPad simulators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/platform-review
          APP_PATH="$(find apps/nalanda-cross-platform/src-tauri/gen/apple/build -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/px1a-devices.json"
          IPHONE_UDID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")))' "$RUNNER_TEMP/px1a-devices.json")"
          IPAD_UDID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPad")))' "$RUNNER_TEMP/px1a-devices.json")"
          for UDID in "$IPHONE_UDID" "$IPAD_UDID"; do
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP_PATH"
            xcrun simctl launch --terminate-running-process "$UDID" com.nalandaps.erp
            sleep 3
            xcrun simctl io "$UDID" screenshot "tmp/platform-review/ios-synthetic-$UDID-light.png"
            xcrun simctl ui "$UDID" appearance dark
            xcrun simctl launch --terminate-running-process "$UDID" com.nalandaps.erp
            sleep 2
            xcrun simctl io "$UDID" screenshot "tmp/platform-review/ios-synthetic-$UDID-dark.png"
            xcrun simctl openurl "$UDID" 'nalandaps-erp://auth/callback?code=invalid&state=invalid&request_id=invalid'
            xcrun simctl terminate "$UDID" com.nalandaps.erp
            xcrun simctl launch "$UDID" com.nalandaps.erp
          done
          printf '%s\n' 'SYNTHETIC UX EVIDENCE ONLY - NO REAL RECORDS' > tmp/platform-review/IOS-SYNTHETIC.txt
          xcrun simctl shutdown "$IPHONE_UDID" || true
          xcrun simctl shutdown "$IPAD_UDID" || true
      - name: Write iOS simulator checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/apple/build
        run: find . -type f ! -name 'SHA256SUMS.txt' -exec shasum -a 256 {} \; > SHA256SUMS.txt
      - name: Verify iOS simulator checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/apple/build
        run: shasum -a 256 --check SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-ios-simulator
          path: apps/nalanda-cross-platform/src-tauri/gen/apple/build
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-ios-simulator-ux
          path: tmp/platform-review/ios-*
          if-no-files-found: error
          retention-days: 7
