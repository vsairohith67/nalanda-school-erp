name: Cross-platform apps 1A

on:
  pull_request:
    paths:
      - "apps/nalanda-cross-platform/**"
      - "app/api/native-auth/**"
      - "app/api/native/**"
      - "app/native/**"
      - "lib/native-app/**"
      - "lib/offline-sync/**"
      - "prisma/**"
      - "tests/*cross-platform*"
      - "tests/native-auth-1a.test.ts"
      - "middleware.ts"
      - "lib/request-security.ts"
      - "lib/security-resilience.ts"
      - "lib/trusted-client.ts"
      - "scripts/harden-cross-platform-generated-project.mjs"
      - "scripts/portable/native-minimum-compile.mjs"
      - "scripts/portable/qa-native-profile-compile.ts"
      - "scripts/qa-ux-native-screen-content.ts"
      - "tests/bulk-ci-runtime.test.ts"
      - "config/release-feature-flags.json"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cross-platform-apps.yml"
  workflow_dispatch:
    inputs:
      connected_native_evidence:
        description: Produce private connected QA evidence only with an already admitted controller and disposable target
        type: boolean
        default: false
      connected_windows_acceptance:
        description: Run connected WD1-WD5 only with admitted same-run artifacts and an authorised disposable private Windows environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NALANDA_NATIVE_PROFILE: "NO_REMOTE_SERVER_CONFIGURED"

jobs:
  native-evidence:
    name: Same-run private Windows QA artifact evidence
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.connected_native_evidence || inputs.connected_windows_acceptance) && github.ref == 'refs/heads/release/recovery-integration-1a' }}
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PORTABLE_CI_EXCEPTION: OWNER_AUTHORIZED
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # This hook consumes an already authorised private environment. It does
      # not provision a controller, tunnel, user profile, CA or SSH credential.
      - name: Produce exact private QA bytes and controller-sealed evidence
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $inputRoot = Join-Path $env:RUNNER_TEMP 'nalanda-native-admission'
          pnpm exec tsx scripts/portable/build-native-qa.ts (Join-Path $inputRoot 'inputs') (Join-Path $inputRoot 'transport.json')
      - name: Execute the admitted connected Windows journey
        if: ${{ inputs.connected_windows_acceptance }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $recipe = Join-Path $env:RUNNER_TEMP 'nalanda-native-admission/windows-connected.json'
          Get-Content -Raw -LiteralPath $recipe | pnpm exec tsx scripts/portable/integrated-acceptance.ts --windows
      - name: Clean only owned same-run native outputs
        if: always()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $transport = Join-Path $env:RUNNER_TEMP 'nalanda-native-admission/transport.json'
          if (Test-Path -LiteralPath $transport) { pnpm exec tsx scripts/portable/build-native-qa.ts --cleanup $transport }
      # No upload-artifact or native-output cache, even for a private repository.
  contracts:
    name: TypeScript, contracts and bundled shell
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DATABASE_URL: "file:../tmp/release-ci/synthetic.db"
      NALANDA_ENVIRONMENT: "TEST"
      NALANDA_RELEASE_ID: cross-platform-ci-${{ github.run_id }}
      NALANDA_RELEASE_CHANNEL: "TEST"
      NEXT_PUBLIC_PWA_BUILD_VERSION: cross-platform-ci-${{ github.run_id }}
      NALANDA_MINIMUM_WEB_CLIENT: cross-platform-ci-${{ github.run_id }}
      NALANDA_CLIENT_UPDATE_SEVERITY: "AVAILABLE"
      NALANDA_RELEASE_DATE: "2026-08-26T00:00:00.000Z"
      NALANDA_STANDALONE_BUILD: "true"
      APP_ORIGIN: "http://127.0.0.1:3000"
      PRIVATE_STORAGE_ROOT: ${{ github.workspace }}/tmp/release-ci/private
      BACKUP_DIRECTORY: ${{ github.workspace }}/tmp/release-ci/backups
      LIVE_PROVIDERS_ENABLED: "false"
      PUBLIC_WEBSITE_INDEXING_ENABLED: "false"
      NALANDA_STAGING_BANNER: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install pinned full-regression tools
        shell: pwsh
        run: |
          choco install ripgrep --version=15.2.0 -y --no-progress
          rg --version
          $popplerArchive = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0.zip'
          $popplerExtract = Join-Path $env:RUNNER_TEMP 'poppler-26.02.0-0'
          Invoke-WebRequest -Uri 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.02.0-0/Release-26.02.0-0.zip' -OutFile $popplerArchive
          $expectedPopplerSha256 = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $actualPopplerSha256 = (Get-FileHash -LiteralPath $popplerArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPopplerSha256 -ne $expectedPopplerSha256) { throw "Pinned Poppler archive checksum mismatch" }
          Expand-Archive -LiteralPath $popplerArchive -DestinationPath $popplerExtract
          $pdfToPpm = Get-Item -LiteralPath (Join-Path $popplerExtract 'poppler-26.02.0\Library\bin\pdftoppm.exe') -ErrorAction Stop
          "REPORT_CARD_PDFTOPPM_PATH=$($pdfToPpm.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          & $pdfToPpm.FullName -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - run: pnpm exec prisma validate --schema prisma/schema.prisma
      - name: Prepare isolated synthetic database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp\release-ci | Out-Null
          if (Test-Path -LiteralPath tmp\release-ci\synthetic.db) { throw "Cross-platform CI synthetic database already exists" }
          New-Item -ItemType File -Path tmp\release-ci\synthetic.db | Out-Null
          pnpm exec prisma migrate deploy
          $env:NODE_ENV = 'development'
          $env:RELEASE_CI_SYNTHETIC_OPT_IN = 'true'
          pnpm exec tsx scripts/prepare-release-ci-synthetic.ts
          Copy-Item -LiteralPath tmp\release-ci\synthetic.db -Destination prisma\dev.db
      - run: pnpm git:safety-check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm security:resilience:acceptance
      - name: Route and lifecycle inventory
        run: |
          pnpm routes:list
          pnpm lifecycle:backfill
      - name: Full ERP regression in the explicitly approved PR28 process context
        # PR28-only process environment; no machine/GPO policy or other PR context.
        timeout-minutes: 120
        env:
          PSExecutionPolicyPreference: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'release/recovery-integration-1a' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1 && startsWith(github.event.pull_request.updated_at, '2026-10-08') && 'RemoteSigned' || '' }}
        run: pnpm test
      - name: Migration and restore-twice acceptance
        run: |
          pnpm migration:inventory
          pnpm migration:fresh-check
          pnpm migration:existing-db-check
          pnpm migration:schema-check
          pnpm migration:restore-check
      - run: pnpm backup
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm app:typecheck
      - run: pnpm test:cross-platform
      - run: pnpm app:build:web

  windows:
    name: Unsigned Windows NSIS compiler gate
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Record Windows compiler environment
        shell: pwsh
        run: node --version; pnpm --version; rustc --version; cargo --version; Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture
      - run: pnpm app:rust:test --locked
      - name: Compile separate QA profile and reject substituted or production inputs
        run: pnpm exec tsx scripts/portable/qa-native-profile-compile.ts --integration-test
      - run: pnpm app:windows:build -- --locked
      - name: Write Windows package checksum
        shell: pwsh
        run: Get-ChildItem apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$([IO.Path]::GetFileName($_.Path))" } | Set-Content apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Verify Windows package checksum
        shell: pwsh
        working-directory: apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis
        run: Get-Content SHA256SUMS.txt | ForEach-Object { $parts = $_ -split ' \*', 2; if ((Get-FileHash -Algorithm SHA256 -LiteralPath $parts[1]).Hash -ne $parts[0]) { throw "Windows package checksum mismatch" } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event.repository.private == true }}
        with:
          name: unsigned-windows-nsis
          path: |
            apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/*.exe
            apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-checksums
          path: apps/nalanda-cross-platform/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug build and emulator UX gate
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - name: Prepare hosted Android runner disk capacity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux ]]; then
            echo "Capacity cleanup is restricted to disposable GitHub-hosted Linux runners" >&2
            exit 78
          fi
          mkdir -p tmp/platform-review
          capacity_log=tmp/platform-review/android-runner-capacity.txt
          record_capacity() { df -Pk . "$RUNNER_TEMP"; df -Pi . "$RUNNER_TEMP"; }
          record_capacity | tee "$capacity_log"
          disk_before_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          # Only unused .NET, Haskell and CodeQL installations; retain all Android build tools.
          for toolchain_dir in /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [[ ! -e "$toolchain_dir" && ! -L "$toolchain_dir" ]]; then
              printf 'Already absent: %s\n' "$toolchain_dir" | tee -a "$capacity_log"
              continue
            fi
            if [[ ! -d "$toolchain_dir" || -L "$toolchain_dir" ]] || mountpoint -q -- "$toolchain_dir"; then
              echo "Refusing unexpected toolchain path or mountpoint: $toolchain_dir" >&2
              exit 78
            fi
            resolved_toolchain="$(realpath -e -- "$toolchain_dir")"
            if [[ "$resolved_toolchain" != "$toolchain_dir" ]]; then
              echo "Refusing toolchain path outside its exact allowlist entry" >&2
              exit 78
            fi
            sudo du -skx -- "$toolchain_dir" | tee -a "$capacity_log"
            sudo rm -rf --one-file-system -- "$toolchain_dir"
          done
          disk_after_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          printf 'RECLAIMED_KIB=%s\n' "$((disk_after_kib - disk_before_kib))" | tee -a "$capacity_log"
          record_capacity | tee -a "$capacity_log"
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Record Android compiler environment
        run: node --version && pnpm --version && rustc --version && cargo --version && java -version && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: pnpm app:android:init
      - run: pnpm app:android:build -- --locked
      - name: Reclaim packaged Android build intermediates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux ]]; then
            echo "Post-package cleanup is restricted to disposable GitHub-hosted Linux runners" >&2
            exit 78
          fi
          apk_root="$GITHUB_WORKSPACE/apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk"
          mapfile -d '' packaged_apks < <(find "$apk_root" -type f -name '*.apk' -print0)
          if (( ${#packaged_apks[@]} < 1 )); then
            echo "Refusing cleanup before a packaged APK exists" >&2
            exit 1
          fi
          workspace_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          target_dir="$workspace_root/apps/nalanda-cross-platform/src-tauri/target"
          expected_target="$workspace_root/apps/nalanda-cross-platform/src-tauri/target"
          if [[ ! -d "$target_dir" || -L "$target_dir" ]] || mountpoint -q -- "$target_dir"; then
            echo "Refusing unexpected Android build-intermediate path or mountpoint" >&2
            exit 78
          fi
          resolved_target="$(realpath -e -- "$target_dir")"
          if [[ "$resolved_target" != "$expected_target" ]]; then
            echo "Refusing Android build-intermediate path outside its exact allowlist entry" >&2
            exit 78
          fi
          capacity_log=tmp/platform-review/android-runner-capacity.txt
          disk_before_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          du -skx -- "$target_dir" | tee -a "$capacity_log"
          rm -rf --one-file-system --preserve-root=all -- "$target_dir"
          disk_after_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          if (( disk_after_kib <= disk_before_kib )); then
            echo "Android build-intermediate cleanup reclaimed no capacity" >&2
            exit 1
          fi
          printf 'POST_PACKAGE_RECLAIMED_KIB=%s\n' "$((disk_after_kib - disk_before_kib))" | tee -a "$capacity_log"
          df -Pk . "$RUNNER_TEMP" | tee -a "$capacity_log"
          for packaged_apk in "${packaged_apks[@]}"; do test -f "$packaged_apk"; done
      - name: Execute the finite no-remote journey in the owned Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/native-1b-avd"
          mkdir -p "$ANDROID_AVD_HOME" tmp/platform-review
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --name native_1b_phone --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd native_1b_phone -port 5580 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/native-1b-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          # Stop only this invocation's owned emulator, never the shared ADB server.
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true; wait "$EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 240 "$ADB" -s emulator-5580 wait-for-device
          ready=0
          for attempt in $(seq 1 90); do
            if [ "$(timeout 10 "$ADB" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          # Use the packaging tool already installed for this generated build.
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          apk_root=apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk
          APK_PATH="$(python3 - "$AAPT" "$apk_root" <<'PY'
          import pathlib,subprocess,sys
          matches=[]
          for p in pathlib.Path(sys.argv[2]).rglob('*.apk'):
              data=subprocess.check_output([sys.argv[1],'dump','badging',str(p)],text=True)
              if "package: name='com.nalandaps.erp'" in data and 'application-debuggable' in data and "'x86_64'" in data: matches.append(p.resolve())
          if len(matches)!=1: raise SystemExit('ANDROID_EXACT_X86_PACKAGE_NOT_UNIQUE')
          print(matches[0])
          PY
          )"
          APK_SHA="$(sha256sum "$APK_PATH" | cut -d ' ' -f1)"
          node node_modules/tsx/dist/cli.mjs apps/nalanda-cross-platform/tests/native/execute.ts --mode execute --platform ANDROID --package "$APK_PATH" --sha256 "$APK_SHA" --serial emulator-5580 --tool "$ADB" --metadata-tool "$AAPT" --output "$RUNNER_TEMP/native-1b-android" > tmp/platform-review/native-1b-android-summary.json
          cat tmp/platform-review/native-1b-android-summary.json
      - name: Write Android package checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk
        run: find . -type f -name '*.apk' -exec sha256sum {} \; > SHA256SUMS.txt
      - name: Verify Android package checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event.repository.private == true }}
        with:
          name: unsigned-android-debug-apk
          path: |
            apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-package-checksums
          path: apps/nalanda-cross-platform/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-1b-android-summary
          path: tmp/platform-review/native-1b-android-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded native child diagnostics only in private repositories
        if: ${{ always() && github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-1b-android-private-process-diagnostics
          path: ${{ runner.temp }}/native-1b-android/process-*
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS simulator build and shared UI gate
    runs-on: macos-15
    timeout-minutes: 70
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Record iOS compiler environment
        run: node --version && pnpm --version && rustc --version && cargo --version && xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - run: pnpm app:ios:init
      - run: pnpm app:rust:test --locked
      - run: pnpm app:ios:build -- --locked
      - name: Execute the finite no-remote journey in owned iPhone and iPad simulators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/platform-review
          APP_PATH="$(python3 - <<'PY'
          import pathlib
          matches=list(pathlib.Path('apps/nalanda-cross-platform/src-tauri/gen/apple/build').rglob('*.app'))
          if len(matches)!=1: raise SystemExit('IOS_EXACT_SIMULATOR_PACKAGE_NOT_UNIQUE')
          print(matches[0].resolve())
          PY
          )"
          APP_SHA="$(node node_modules/tsx/dist/cli.mjs -e 'import {packageDigest} from "./apps/nalanda-cross-platform/tests/native/execute.ts"; console.log(packageDigest(process.argv[1]))' "$APP_PATH")"
          native_status=0
          for kind in phone tablet; do
            if node node_modules/tsx/dist/cli.mjs apps/nalanda-cross-platform/tests/native/execute.ts --mode execute --platform IOS --target-kind "$kind" --package "$APP_PATH" --sha256 "$APP_SHA" --tool /usr/bin/xcrun --metadata-tool /usr/bin/xcodebuild --output "$RUNNER_TEMP/native-1b-ios-$kind" > "tmp/platform-review/native-1b-ios-$kind-summary.json"; then
              :
            else
              native_status=1
            fi
            if ! cat "tmp/platform-review/native-1b-ios-$kind-summary.json" 2>/dev/null; then
              native_status=1
            fi
          done
          exit "$native_status"
      - name: Write iOS simulator checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/apple/build
        run: find . -type f ! -name 'SHA256SUMS.txt' -exec shasum -a 256 {} \; > SHA256SUMS.txt
      - name: Verify iOS simulator checksums
        working-directory: apps/nalanda-cross-platform/src-tauri/gen/apple/build
        run: shasum -a 256 --check SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event.repository.private == true }}
        with:
          name: unsigned-ios-simulator
          path: apps/nalanda-cross-platform/src-tauri/gen/apple/build
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-package-checksums
          path: apps/nalanda-cross-platform/src-tauri/gen/apple/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-1b-ios-summary
          path: tmp/platform-review/native-1b-ios-*-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded native child diagnostics only in private repositories
        if: ${{ always() && github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-1b-ios-private-process-diagnostics
          path: ${{ runner.temp }}/native-1b-ios-*/process-*
          if-no-files-found: warn
          retention-days: 7


  minimum-windows:
    name: Draft Rust 1.90 Windows production and QA tests
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      RUSTUP_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-rustup
      CARGO_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/nalanda-minimum-target
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update
      - run: node scripts/portable/native-minimum-compile.mjs x86_64-pc-windows-msvc
      - name: Minimum QA unit tests and unchanged compiler-refusal controls
        run: pnpm exec tsx scripts/portable/qa-native-profile-compile.ts --minimum-test

  minimum-linux:
    name: Draft Rust 1.90 Linux ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-rustup
      CARGO_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/nalanda-minimum-target
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - name: Native GTK and WebKit compiler prerequisites on the disposable runner
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update --target ${{ matrix.target }}
      - run: node scripts/portable/native-minimum-compile.mjs ${{ matrix.target }}

  minimum-macos:
    name: Draft Rust 1.90 macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-rustup
      CARGO_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/nalanda-minimum-target
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update --target ${{ matrix.target }}
      - run: xcodebuild -version
      - run: node scripts/portable/native-minimum-compile.mjs ${{ matrix.target }}

  minimum-android:
    name: Draft Rust 1.90 Android ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-rustup
      CARGO_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/nalanda-minimum-target
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update --target ${{ matrix.target }}
      - name: Use the hosted runner's installed NDK for API 28 compiler checks
        run: node scripts/portable/native-minimum-compile.mjs ${{ matrix.target }}

  minimum-ios:
    name: Draft Rust 1.90 iOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-ios }
          - { runner: macos-15, target: aarch64-apple-ios-sim }
          - { runner: macos-15-intel, target: x86_64-apple-ios }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-rustup
      CARGO_HOME: ${{ github.workspace }}/tmp/nalanda-minimum-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/nalanda-minimum-target
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0 }
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update --target ${{ matrix.target }}
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version && xcrun --sdk iphonesimulator --show-sdk-version
      - run: node scripts/portable/native-minimum-compile.mjs ${{ matrix.target }}
